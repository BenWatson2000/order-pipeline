[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "order-pipeline"
version = "0.1.0"
description = "ETL pipeline turning raw e-commerce order events into query-friendly tables"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pandas>=2.2,<3",
    "pyarrow>=17",
    "duckdb>=1.1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
order-pipeline = "order_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
